# Used when running a locally installed Flyway CLI:  flyway clean migrate
# (docker compose passes the same settings as FLYWAY_* environment variables)
flyway.url=jdbc:postgresql://localhost:5432/capstone
flyway.user=capstone_admin
# flyway.password=...   -> pass on the command line or via FLYWAY_PASSWORD, never commit it
flyway.locations=filesystem:migrations
flyway.cleanDisabled=false
