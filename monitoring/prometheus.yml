global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: postgres-primary
    static_configs:
      - targets: ["postgres_exporter:9187"]
        labels: { role: primary }
  - job_name: postgres-replica
    static_configs:
      - targets: ["postgres_exporter_replica:9187"]
        labels: { role: replica }
  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
